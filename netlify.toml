# Netlify settings — you shouldn't need to change this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- Redirects from the old website's addresses (301 = permanent) ----------
[[redirects]]
  from = "/intelligence-hub"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/logic-hub"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/our-mission"
  to = "/about"
  status = 301

[[redirects]]
  from = "/partnership-opportunities"
  to = "/about#partnerships"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms-of-service"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

# ---------- Security & speed headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
